<style>
.ship{animation:sail 140s linear infinite}
.ship2{animation:sail 200s linear infinite reverse}
@keyframes sail{from{transform:translateX(-600px)}to{transform:translateX(600px)}}
.gull{animation:fly 40s linear infinite}
.gull path{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fly{from{transform:translateX(-500px)}to{transform:translateX(700px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.cloud{animation:drift 220s linear infinite alternate}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.wave{animation:glimmer 5s ease-in-out infinite alternate}
@keyframes glimmer{from{opacity:.25}to{opacity:.8}}
</style>
