<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b5f95"/><stop offset=".55" stop-color="#5a98cf"/><stop offset=".82" stop-color="#a9cfe8"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d8fa8"/><stop offset=".25" stop-color="#2d526d"/><stop offset="1" stop-color="#10202c"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3d6" stop-opacity=".95"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
<linearGradient id="glint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0cf" stop-opacity=".55"/><stop offset="1" stop-color="#fff0cf" stop-opacity="0"/></linearGradient>
